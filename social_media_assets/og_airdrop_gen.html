<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; }
  canvas { display: block; }
  button { padding: 12px 32px; background: #7c3aed; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-family: system-ui; }
  button:hover { background: #6d28d9; }
  p { color: #aaa; font-family: system-ui; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<button onclick="download()">Download og-airdrop.png</button>
<p>1200 × 630 px — OpenGraph image for airdrop.html</p>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 1200, H = 630;

function draw() {
  // ── Background ────────────────────────────────────────────────
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0,   '#03050f');
  bg.addColorStop(0.4, '#070d1f');
  bg.addColorStop(0.7, '#0a0f25');
  bg.addColorStop(1,   '#04080f');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // ── Grid ──────────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(0,200,255,0.04)';
  ctx.lineWidth = 1;
  const step = 60;
  for (let x = 0; x <= W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // ── Orb left (purple) ─────────────────────────────────────────
  const orbL = ctx.createRadialGradient(0, 0, 0, 0, 0, 420);
  orbL.addColorStop(0, 'rgba(100,60,255,0.18)');
  orbL.addColorStop(1, 'rgba(100,60,255,0)');
  ctx.fillStyle = orbL;
  ctx.fillRect(0, 0, W, H);

  // ── Orb right (cyan) ──────────────────────────────────────────
  const orbR = ctx.createRadialGradient(W + 40, H + 60, 0, W + 40, H + 60, 520);
  orbR.addColorStop(0, 'rgba(0,200,255,0.12)');
  orbR.addColorStop(1, 'rgba(0,200,255,0)');
  ctx.fillStyle = orbR;
  ctx.fillRect(0, 0, W, H);

  // ── Accent line top ───────────────────────────────────────────
  const topLine = ctx.createLinearGradient(0, 0, W, 0);
  topLine.addColorStop(0,    'rgba(124,58,237,0)');
  topLine.addColorStop(0.2,  '#7c3aed');
  topLine.addColorStop(0.5,  '#06b6d4');
  topLine.addColorStop(0.8,  '#7c3aed');
  topLine.addColorStop(1,    'rgba(124,58,237,0)');
  ctx.fillStyle = topLine;
  ctx.fillRect(0, 0, W, 3);

  // ── Accent line bottom ────────────────────────────────────────
  const botLine = ctx.createLinearGradient(0, 0, W, 0);
  botLine.addColorStop(0,   'rgba(124,58,237,0)');
  botLine.addColorStop(0.3, 'rgba(124,58,237,0.4)');
  botLine.addColorStop(0.7, 'rgba(6,182,212,0.4)');
  botLine.addColorStop(1,   'rgba(6,182,212,0)');
  ctx.fillStyle = botLine;
  ctx.fillRect(0, H - 1, W, 1);

  // ── Left vertical accent ──────────────────────────────────────
  const vertLine = ctx.createLinearGradient(0, 60, 0, H - 60);
  vertLine.addColorStop(0,   'rgba(124,58,237,0)');
  vertLine.addColorStop(0.3, '#7c3aed');
  vertLine.addColorStop(0.7, '#06b6d4');
  vertLine.addColorStop(1,   'rgba(6,182,212,0)');
  ctx.fillStyle = vertLine;
  ctx.globalAlpha = 0.6;
  ctx.fillRect(72, 60, 2, H - 120);
  ctx.globalAlpha = 1;

  // ── CONTENT ───────────────────────────────────────────────────
  const LEFT = 116;

  // Label
  ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#06b6d4';
  ctx.globalAlpha = 0.9;
  ctx.letterSpacing = '4px';
  ctx.fillText('ZENTHIS  ·  AIRDROP  ·  EARN BEFORE IDO', LEFT, 100);
  ctx.globalAlpha = 1;

  // ── "5,000,000" big number ────────────────────────────────────
  ctx.font = '800 108px "Segoe UI", system-ui, sans-serif';
  const numGrad = ctx.createLinearGradient(LEFT, 0, LEFT + 620, 0);
  numGrad.addColorStop(0, '#7c3aed');
  numGrad.addColorStop(1, '#06b6d4');
  ctx.fillStyle = numGrad;
  ctx.fillText('5,000,000', LEFT, 220);

  // "ZENTHIS" next to number
  ctx.font = '800 52px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('ZENTHIS', LEFT, 280);

  // Subline
  ctx.font = '400 28px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('Connect wallet · Complete tasks · Refer friends', LEFT, 340);

  // ── Pills row ─────────────────────────────────────────────────
  const pills = [
    { text: 'IDO June 15, 2026',    dot: '#06b6d4', border: 'rgba(6,182,212,0.4)',   textColor: '#06b6d4' },
    { text: 'Points → ZENTHIS',     dot: '#7c3aed', border: 'rgba(255,255,255,0.12)', textColor: 'rgba(255,255,255,0.7)' },
    { text: '+100 Early Bird bonus', dot: '#06b6d4', border: 'rgba(255,255,255,0.12)', textColor: 'rgba(255,255,255,0.7)' },
  ];

  let px = LEFT;
  const py = 400;
  const pillH = 42;
  const pillR = 21;

  ctx.font = '600 16px "Segoe UI", system-ui, sans-serif';

  for (const pill of pills) {
    const tw = ctx.measureText(pill.text).width;
    const pw = tw + 52; // dot + gaps + padding

    // Pill background
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    roundRect(ctx, px, py, pw, pillH, pillR);
    ctx.fill();

    // Pill border
    ctx.strokeStyle = pill.border;
    ctx.lineWidth = 1;
    roundRect(ctx, px, py, pw, pillH, pillR);
    ctx.stroke();

    // Dot
    ctx.fillStyle = pill.dot;
    ctx.beginPath();
    ctx.arc(px + 18, py + pillH / 2, 5, 0, Math.PI * 2);
    ctx.fill();

    // Text
    ctx.fillStyle = pill.textColor;
    ctx.fillText(pill.text, px + 30, py + pillH / 2 + 6);

    px += pw + 14;
  }

  // ── Right-side block ──────────────────────────────────────────
  // Pool size box
  const bx = W - 340, by = 130, bw = 280, bh = 220;

  // Box bg
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  roundRect(ctx, bx, by, bw, bh, 16);
  ctx.fill();

  // Box border gradient
  ctx.strokeStyle = 'rgba(124,58,237,0.3)';
  ctx.lineWidth = 1;
  roundRect(ctx, bx, by, bw, bh, 16);
  ctx.stroke();

  // Box label
  ctx.font = '500 13px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.textAlign = 'center';
  ctx.fillText('TOTAL AIRDROP POOL', bx + bw / 2, by + 44);

  // Pool number
  ctx.font = '800 44px "Segoe UI", system-ui, sans-serif';
  const poolGrad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  poolGrad.addColorStop(0, '#7c3aed');
  poolGrad.addColorStop(1, '#06b6d4');
  ctx.fillStyle = poolGrad;
  ctx.fillText('5,000,000', bx + bw / 2, by + 102);

  ctx.font = '600 18px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('ZENTHIS TOKENS', bx + bw / 2, by + 132);

  // Divider
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(bx + 24, by + 150, bw - 48, 1);

  // Sub stats
  ctx.font = '500 14px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText('$0.10 per token at IDO', bx + bw / 2, by + 178);
  ctx.fillStyle = '#06b6d4';
  ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
  ctx.fillText('$500,000 value', bx + bw / 2, by + 204);
  ctx.textAlign = 'left';

  // ── Site URL bottom right ─────────────────────────────────────
  ctx.font = '400 15px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(6,182,212,0.5)';
  ctx.textAlign = 'right';
  ctx.fillText('zenthisprotocol.xyz', W - 72, H - 40);
  ctx.textAlign = 'left';

  // ── Logo mark top-right ───────────────────────────────────────
  ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.textAlign = 'right';
  ctx.fillText('⬡ Zenthis', W - 72, 60);
  ctx.textAlign = 'left';
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function download() {
  const link = document.createElement('a');
  link.download = 'og-airdrop.png';
  link.href = c.toDataURL('image/png');
  link.click();
}

draw();
</script>
</body>
</html>
