<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1500px;
    height: 500px;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .banner {
    width: 1500px;
    height: 500px;
    position: relative;
    background: linear-gradient(135deg, #03050f 0%, #070d1f 40%, #0a0f25 70%, #04080f 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 100px;
  }

  /* Subtle grid lines */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 200, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 200, 255, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Glow orb left */
  .orb-left {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100, 60, 255, 0.12) 0%, transparent 70%);
    left: -100px;
    top: -100px;
  }

  /* Glow orb right */
  .orb-right {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 200, 255, 0.08) 0%, transparent 70%);
    right: -50px;
    bottom: -200px;
  }

  /* Accent line top */
  .accent-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, #7c3aed 20%, #06b6d4 50%, #7c3aed 80%, transparent 100%);
    opacity: 0.8;
  }

  /* Accent line bottom */
  .accent-line-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(124, 58, 237, 0.4) 30%, rgba(6, 182, 212, 0.4) 70%, transparent 100%);
  }

  /* Vertical accent */
  .vert-line {
    position: absolute;
    left: 78px;
    top: 60px;
    bottom: 60px;
    width: 2px;
    background: linear-gradient(180deg, transparent, #7c3aed, #06b6d4, transparent);
    opacity: 0.6;
  }

  .content {
    position: relative;
    z-index: 10;
    padding-left: 30px;
  }

  .label {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #06b6d4;
    margin-bottom: 18px;
    opacity: 0.9;
  }

  .headline {
    font-size: 72px;
    font-weight: 800;
    line-height: 1.05;
    color: #ffffff;
    letter-spacing: -1px;
    margin-bottom: 12px;
  }

  .headline .highlight {
    background: linear-gradient(90deg, #7c3aed, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subline {
    font-size: 26px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.5px;
    margin-bottom: 36px;
  }

  .pills {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 15px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.3px;
  }

  .pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #06b6d4;
    flex-shrink: 0;
  }

  .pill .dot-purple {
    background: #7c3aed;
  }

  .pill.ido {
    border-color: rgba(6, 182, 212, 0.35);
    color: #06b6d4;
    font-weight: 600;
  }

  /* Right side subtle element */
  .right-element {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
    z-index: 10;
  }

  .right-handle {
    font-size: 20px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 2px;
    font-weight: 300;
    margin-bottom: 8px;
  }

  .right-site {
    font-size: 15px;
    color: rgba(6, 182, 212, 0.5);
    letter-spacing: 1px;
  }

</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="orb-left"></div>
  <div class="orb-right"></div>
  <div class="accent-line"></div>
  <div class="accent-line-bottom"></div>
  <div class="vert-line"></div>

  <div class="content">
    <div class="label">Founder · Builder · Crypto</div>
    <div class="headline">
      Building <span class="highlight">@zenthis_io</span>
    </div>
    <div class="subline">Cross-chain without bridges.</div>
    <div class="pills">
      <div class="pill ido">
        <span class="dot"></span>
        IDO June 15, 2026
      </div>
      <div class="pill">
        <span class="dot dot-purple"></span>
        $0.10 · $10M FDV
      </div>
      <div class="pill">
        <span class="dot"></span>
        zenthisprotocol.xyz
      </div>
    </div>
  </div>

  <div class="right-element">
    <div class="right-handle">@marcostrobo</div>
    <div class="right-site">zenthisprotocol.xyz</div>
  </div>

</div>
</body>
</html>
