<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenthis Admin — Whitelist</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="1024x1024" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07070f; --card: #111120; --border: rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.13); --purple: #7c3aed; --cyan: #06b6d4;
      --green: #10b981; --red: #ef4444; --text: #f1f5f9; --muted: #94a3b8;
      --dim: #475569; --grad: linear-gradient(135deg,#7c3aed,#06b6d4);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    a { color: var(--cyan); text-decoration: none; }

    /* ─── PASSWORD GATE ─── */
    #gate {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .gate-box {
      background: var(--card); border: 1px solid var(--border2); border-radius: 18px;
      padding: 40px 32px; max-width: 360px; width: 100%; text-align: center;
    }
    .gate-hex { font-size: 2.2rem; background: var(--grad); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 14px; }
    .gate-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
    .gate-sub { font-size: .82rem; color: var(--muted); margin-bottom: 28px; }
    .gate-input {
      width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border2);
      border-radius: 10px; padding: 12px 16px; color: var(--text); font-size: .95rem;
      outline: none; margin-bottom: 12px; text-align: center; letter-spacing: .1em;
    }
    .gate-input:focus { border-color: var(--purple); }
    .gate-btn {
      width: 100%; background: var(--grad); border: none; border-radius: 10px;
      padding: 13px; color: #fff; font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem; font-weight: 700; cursor: pointer; transition: opacity .2s;
    }
    .gate-btn:hover { opacity: .88; }
    .gate-err { color: #fca5a5; font-size: .8rem; margin-top: 10px; min-height: 18px; }

    /* ─── ADMIN UI ─── */
    #app { display: none; min-height: 100vh; flex-direction: column; }
    .adm-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; height: 60px; border-bottom: 1px solid var(--border);
      background: rgba(7,7,15,.9); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 10;
    }
    .adm-logo { display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 800; }
    .adm-logo-icon { font-size: 1.2rem; background: var(--grad); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text; }
    .adm-badge { font-size: .68rem; background: rgba(124,58,237,.2); border: 1px solid rgba(124,58,237,.4);
      color: #a78bfa; border-radius: 20px; padding: 3px 10px; font-weight: 700; letter-spacing: .04em; }
    .adm-logout { background: none; border: 1px solid var(--border2); border-radius: 8px;
      color: var(--muted); padding: 6px 14px; font-size: .8rem; cursor: pointer; transition: all .2s; }
    .adm-logout:hover { border-color: var(--red); color: #fca5a5; }

    .adm-main { flex: 1; padding: 32px 28px; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: var(--card); border: 1px solid var(--border2); border-radius: 14px; padding: 20px; }
    .stat-val { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 800;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-label { font-size: .75rem; color: var(--muted); margin-top: 4px; }

    /* Controls */
    .controls-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 220px; background: rgba(255,255,255,.05); border: 1px solid var(--border2);
      border-radius: 8px; padding: 9px 14px; color: var(--text); font-size: .85rem; outline: none;
    }
    .search-input:focus { border-color: var(--purple); }
    .export-btn {
      background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.35); border-radius: 8px;
      color: var(--green); padding: 9px 18px; font-size: .82rem; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .export-btn:hover { background: rgba(16,185,129,.22); }
    .refresh-btn {
      background: rgba(124,58,237,.12); border: 1px solid rgba(124,58,237,.35); border-radius: 8px;
      color: #a78bfa; padding: 9px 18px; font-size: .82rem; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .refresh-btn:hover { background: rgba(124,58,237,.22); }

    /* Table */
    .table-wrap { background: var(--card); border: 1px solid var(--border2); border-radius: 14px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { padding: 12px 16px; text-align: left; font-size: .7rem; font-weight: 700; color: var(--dim);
      text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.025); }
    tbody td { padding: 12px 16px; font-size: .83rem; color: var(--text); }
    .td-num { color: var(--dim); font-size: .75rem; }
    .td-twitter { color: #60a5fa; font-weight: 600; }
    .td-wallet { font-family: monospace; font-size: .75rem; color: var(--muted); }
    .td-date { color: var(--muted); font-size: .75rem; }
    .tag-wallet { display: inline-block; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3);
      color: var(--green); border-radius: 6px; padding: 1px 7px; font-size: .68rem; font-weight: 700; }
    .tag-no-wallet { display: inline-block; background: rgba(255,255,255,.04); border: 1px solid var(--border);
      color: var(--dim); border-radius: 6px; padding: 1px 7px; font-size: .68rem; }

    /* Loading / empty */
    .adm-loading { text-align: center; padding: 60px; color: var(--muted); font-size: .9rem; }
    .adm-empty { text-align: center; padding: 60px; color: var(--dim); font-size: .85rem; }

    @media (max-width: 700px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .adm-main { padding: 20px 16px; }
      .adm-header { padding: 0 16px; }
      table th:nth-child(4), table td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

  <!-- ─── PASSWORD GATE ─── -->
  <div id="gate">
    <div class="gate-box">
      <div class="gate-hex">⬡</div>
      <h1 class="gate-title">Admin Panel</h1>
      <p class="gate-sub">Enter the admin password to access whitelist data.</p>
      <input type="password" class="gate-input" id="pwInput" placeholder="Password" autocomplete="current-password" />
      <button class="gate-btn" id="pwBtn">Access →</button>
      <div class="gate-err" id="pwErr"></div>
    </div>
  </div>

  <!-- ─── ADMIN APP ─── -->
  <div id="app">
    <header class="adm-header">
      <div class="adm-logo">
        <span class="adm-logo-icon">⬡</span>
        <span>Zenthis</span>
        <span class="adm-badge">Admin</span>
      </div>
      <button class="adm-logout" id="logoutBtn">Logout</button>
    </header>

    <main class="adm-main">

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-val" id="statTotal">—</div>
          <div class="stat-label">Total signups</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statToday">—</div>
          <div class="stat-label">Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statWallet">—</div>
          <div class="stat-label">With wallet</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statPct">—</div>
          <div class="stat-label">Wallet %</div>
        </div>
      </div>

      <div class="controls-row">
        <input type="text" class="search-input" id="searchInput" placeholder="Search Twitter, email, wallet…" />
        <button class="refresh-btn" id="refreshBtn">↺ Refresh</button>
        <button class="export-btn" id="exportBtn">↓ Export CSV</button>
      </div>

      <div class="table-wrap">
        <div class="adm-loading" id="tableMsg">Loading…</div>
        <table id="dataTable" style="display:none">
          <thead>
            <tr>
              <th>#</th>
              <th>Twitter</th>
              <th>Email</th>
              <th>Wallet</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

    </main>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
