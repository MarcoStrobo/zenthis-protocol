services:
  - type: worker
    name: zenthis-telegram-bot
    env: python
    buildCommand: "cd telegram_bot && pip install -r requirements.txt"
    startCommand: "cd telegram_bot && python bot.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
