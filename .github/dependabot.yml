version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      hardhat-toolchain:
        patterns: ["hardhat*", "@nomicfoundation/*"]
    # Hardhat 3 is ESM-only; migrating the CJS config and tests is deferred until after the external audit.
    ignore:
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/functions"
    schedule:
      interval: weekly
