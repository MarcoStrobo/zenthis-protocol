name: Deploy to Sepolia

on:
  workflow_dispatch:     # Manual trigger from GitHub UI
    inputs:
      confirm:
        description: 'Type "DEPLOY" to confirm Sepolia deployment'
        required: true
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DEPLOY'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Deploy to Sepolia
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          WALLET_SEED: ${{ vars.WALLET_SEED }}
          WALLET_IDO: ${{ vars.WALLET_IDO }}
          WALLET_LIQUIDITY: ${{ vars.WALLET_LIQUIDITY }}
          WALLET_TEAM: ${{ vars.WALLET_TEAM }}
          WALLET_TREASURY: ${{ vars.WALLET_TREASURY }}
          WALLET_FOUNDER_OPS: ${{ vars.WALLET_FOUNDER_OPS }}
          WALLET_AIRDROPS: ${{ vars.WALLET_AIRDROPS }}
          TGE_TIMESTAMP: ${{ vars.TGE_TIMESTAMP }}
        run: npx hardhat run scripts/deploy.js --network sepolia
