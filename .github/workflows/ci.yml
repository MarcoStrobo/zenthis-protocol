name: Zenthis CI

on:
  push:
    branches: [main, master, develop, "feat/*", "fix/*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check JavaScript formatting
        run: npx prettier --check "test/**/*.js" "scripts/**/*.js"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Compile contracts
        run: npx hardhat compile
      - name: Run unit tests
        run: npx hardhat test
      - name: Run integration tests
        run: npx hardhat run scripts/deploy-and-test.js --network hardhat

  gas-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run tests with gas reporting
        run: REPORT_GAS=true npx hardhat test
